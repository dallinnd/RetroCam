<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FilmCam Retro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#1a1a1a">
</head>
<body>
    <div id="app-container">
        <video id="video" autoplay playsinline></video>
        <div class="grain-overlay" id="grain"></div>

        <div class="slider-sidebar">
            <div class="control-group">
                <label>Exp</label>
                <input type="range" id="exposure" min="0.5" max="1.5" step="0.1" value="1">
            </div>
            <div class="control-group">
                <label>Warm</label>
                <input type="range" id="warmth" min="0" max="100" step="5" value="20">
            </div>
            <div class="control-group">
                <label>Grain</label>
                <input type="range" id="grain-slider" min="0" max="0.15" step="0.01" value="0.05">
            </div>
        </div>

        <div class="controls">
            <button id="capture-btn"></button>
            <div id="last-photo-preview" class="thumbnail"></div>
        </div>
    </div>

    <canvas id="photo-canvas" style="display:none;"></canvas>
    <script src="app.js"></script>
</body>
</html>
